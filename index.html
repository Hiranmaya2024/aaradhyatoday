
<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aaradhya Recovery Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* ═══ THEME ═══ */
:root{
  --bg:#080c16;--s1:#0d1528;--s2:#121d35;--s3:#172240;
  --b1:#1a2a50;--b2:#223368;
  --acc:#00e5ff;--acc2:#00b8cc;--acc-bg:rgba(0,229,255,.07);
  --red:#ff3355;--amber:#ffbb00;--green:#00e070;
  --text:#c0d4f0;--text2:#5a80b0;--muted:#1e3060;
  --font-disp:'Orbitron',monospace;
  --font-head:'Rajdhani',sans-serif;
  --font-body:'Roboto Condensed',sans-serif;
  --font-mono:'Roboto Condensed',monospace;
  --card-r:8px;--btn-r:4px;
  --shadow:0 8px 32px rgba(0,0,0,.5);
  --sweep:linear-gradient(90deg,transparent,#00e5ff,#00b8cc,transparent);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

body{
  font-family:var(--font-body);
  background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;
}

/* dot grid bg */
body::before{
  content:'';position:fixed;inset:0;
  background-image:radial-gradient(circle,rgba(128,128,128,.07) 1px,transparent 1px);
  background-size:24px 24px;pointer-events:none;z-index:0;
}

/* ─── HEADER ─── */
.header{
  position:sticky;top:0;z-index:200;
  background:rgba(8,12,22,.97);
  border-bottom:1px solid var(--b1);
  backdrop-filter:blur(20px);
  padding:0 20px;height:60px;
  display:flex;align-items:center;justify-content:space-between;
  font-family:var(--font-disp);font-size:15px;color:var(--acc);
  letter-spacing:.04em;
}
.header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:var(--sweep);background-size:200%;
  animation:sweep 3s linear infinite;
}
@keyframes sweep{0%{background-position:0%}100%{background-position:200%}}

.header-brand{display:flex;align-items:center;gap:12px}
.header-icon{
  width:36px;height:36px;background:var(--acc-bg);
  border:1.5px solid var(--acc);border-radius:var(--card-r);
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.header-sub-row{display:flex;align-items:center;gap:6px;margin-top:2px}
.header-sub{
  font-family:var(--font-mono);font-size:9px;color:var(--text2);
  letter-spacing:.16em;text-transform:uppercase;
}
.v-badge{
  font-family:var(--font-mono);font-size:9px;font-weight:700;
  color:var(--bg);background:var(--acc);border-radius:3px;
  padding:2px 6px;letter-spacing:.06em;opacity:.85;
}
.live-chip{
  display:flex;align-items:center;gap:7px;
  background:var(--acc-bg);border:1px solid var(--b2);
  border-radius:20px;padding:4px 14px;
  font-family:var(--font-mono);font-size:10px;color:var(--text2);letter-spacing:.08em;
}
.live-dot{
  width:6px;height:6px;border-radius:50%;background:var(--acc);
  animation:ldot 1.8s ease-in-out infinite;
}
@keyframes ldot{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}

/* ─── MAIN WRAP ─── */
#mainScreen{position:relative;z-index:1}

/* ─── ROUTE BOX ─── */
.routeBox{
  background:var(--s1);margin:14px;padding:0;border-radius:var(--card-r);
  display:grid;grid-template-columns:1fr 1fr;gap:0;
  box-shadow:var(--shadow);border:1px solid var(--b1);overflow:hidden;
}
.routeBox::before{
  content:'';grid-column:1/-1;height:3px;
  background:var(--sweep);background-size:200%;
  animation:sweep 3s linear infinite;
}

.leftBox{
  font-family:var(--font-body);font-size:13px;line-height:2;
  color:var(--text);padding:16px;border-right:1px solid var(--b1);
}
.leftBox b{
  font-family:var(--font-head);font-size:15px;color:var(--acc);
  display:block;margin-bottom:4px;
}

.partyList{
  max-height:170px;overflow:auto;font-size:12px;
  padding:16px;font-family:var(--font-mono);
}
.partyList div{
  padding:7px 10px;margin-bottom:6px;
  background:var(--s2);border:1px solid var(--b1);
  border-left:3px solid var(--acc);border-radius:var(--btn-r);
  cursor:pointer;transition:all .2s;color:var(--text);
}
.partyList div:hover{background:var(--acc-bg);color:var(--acc);border-left-color:var(--acc2)}

/* ─── TOUR BUTTON ─── */
.tour{
  background:var(--acc);color:var(--bg);
  border:none;border-radius:var(--btn-r);
  font-family:var(--font-head);font-size:13px;font-weight:700;
  padding:9px 16px;margin-top:10px;width:100%;
  cursor:pointer;letter-spacing:.04em;transition:all .2s;
}
.tour:hover{opacity:.85;transform:translateY(-1px)}

/* ─── SECTION LABEL ─── */
.s-lbl{
  display:flex;align-items:center;gap:10px;
  margin:16px 14px 10px;
  font-family:var(--font-mono);font-size:10px;color:var(--acc);
  letter-spacing:.18em;text-transform:uppercase;
}
.s-lbl::after{content:'';flex:1;height:1px;background:linear-gradient(to right,var(--b2),transparent)}

/* ─── CUSTOMER GRID ─── */
.grid{
  padding:0 14px 14px;display:grid;gap:10px;
  position:relative;z-index:1;
}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.grid{grid-template-columns:1fr 1fr 1fr}}

.customer{
  background:var(--s1);padding:0;border-radius:var(--card-r);
  border:1px solid var(--b1);overflow:hidden;
  box-shadow:var(--shadow);cursor:pointer;
  transition:all .25s;animation:cardIn .35s ease both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.customer::before{content:'';display:block;height:3px;background:var(--acc)}
.customer:hover{border-color:var(--b2);transform:translateY(-3px)}
.customer-inner{padding:13px 14px}
.customer-name{
  font-family:var(--font-head);font-size:15px;font-weight:700;
  color:var(--text);margin-bottom:4px;
}
.customer-meta{
  font-family:var(--font-mono);font-size:11px;color:var(--text2);
  line-height:1.7;
}
.tag-blocked{
  display:inline-block;margin-top:6px;
  font-family:var(--font-mono);font-size:9px;font-weight:700;
  padding:3px 8px;border-radius:var(--btn-r);letter-spacing:.06em;
  background:rgba(255,51,85,.12);color:#ff3355;border:1px solid rgba(255,51,85,.25);
  animation:critPulse 1.2s ease-in-out infinite;
}
@keyframes critPulse{0%,100%{opacity:1}50%{opacity:.45}}
.tag-collect{
  display:inline-block;margin-top:6px;
  font-family:var(--font-mono);font-size:9px;font-weight:700;
  padding:3px 8px;border-radius:var(--btn-r);letter-spacing:.06em;
  background:rgba(0,224,112,.1);color:#00e070;border:1px solid rgba(0,224,112,.22);
}
.tag-followup{
  display:inline-block;margin-top:6px;
  font-family:var(--font-mono);font-size:9px;font-weight:700;
  padding:3px 8px;border-radius:var(--btn-r);letter-spacing:.06em;
  background:rgba(255,187,0,.1);color:#ffbb00;border:1px solid rgba(255,187,0,.22);
}

/* ─── PROFILE SCREEN ─── */
.profileWrapper{background:var(--bg);min-height:100vh;position:relative;z-index:1}
.profileWrapper::before{
  content:'';position:fixed;inset:0;
  background-image:radial-gradient(circle,rgba(128,128,128,.07) 1px,transparent 1px);
  background-size:24px 24px;pointer-events:none;z-index:0;
}

.profileHeader{
  position:sticky;top:0;z-index:200;
  background:rgba(8,12,22,.97);
  border-bottom:1px solid var(--b1);
  backdrop-filter:blur(20px);
  padding:0 20px;height:60px;
  font-family:var(--font-disp);font-size:14px;color:var(--acc);
  letter-spacing:.06em;
  display:flex;align-items:center;gap:12px;
}
.profileHeader::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:var(--sweep);background-size:200%;
  animation:sweep 3s linear infinite;
}

.backBtn{
  background:var(--acc-bg);border:1px solid var(--b2);color:var(--acc);
  padding:6px 14px;border-radius:var(--btn-r);
  font-family:var(--font-head);font-size:13px;font-weight:700;
  cursor:pointer;transition:all .2s;letter-spacing:.02em;
}
.backBtn:hover{background:var(--acc);color:var(--bg)}

.profileCard{
  background:var(--s1);margin:16px;padding:0;
  border-radius:var(--card-r);border:1px solid var(--b1);
  box-shadow:var(--shadow);overflow:hidden;
  position:relative;z-index:1;
}
.profileCard::before{content:'';display:block;height:3px;background:var(--sweep);background-size:200%;animation:sweep 3s linear infinite}

.profileCard h2{
  font-family:var(--font-disp);font-size:17px;color:var(--acc);
  letter-spacing:.04em;padding:16px 18px 12px;
  border-bottom:1px solid var(--b1);background:var(--s2);
}

.info{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 18px;border-bottom:1px solid var(--b1);
  font-family:var(--font-body);font-size:12px;color:var(--text2);
}
.info:last-of-type{border-bottom:none}
.info b{font-family:var(--font-head);font-size:13px;font-weight:700;color:var(--text)}
.info a{color:var(--acc);text-decoration:none;font-family:var(--font-mono)}
.info a:hover{text-decoration:underline}

.actionRow{
  display:flex;gap:8px;padding:14px 18px;
  background:var(--s2);border-top:1px solid var(--b1);
}
.actionRow button{
  flex:1;padding:12px;border:none;border-radius:var(--btn-r);
  font-family:var(--font-head);font-size:13px;font-weight:700;
  cursor:pointer;transition:all .2s;letter-spacing:.03em;
}
.actionRow button:hover{opacity:.85;transform:translateY(-1px)}

.call{background:var(--green);color:var(--bg)}
.wa{background:#25D366;color:#fff}
.nav{background:var(--acc);color:var(--bg)}

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--s1)}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--acc)}

@media(max-width:600px){
  .routeBox{grid-template-columns:1fr;margin:10px}
  .leftBox{border-right:none;border-bottom:1px solid var(--b1)}
  .live-chip{display:none}
  .grid{padding:0 10px 10px}
}
</style>
</head>

<body>

<div id="mainScreen">
<div class="header">
  <div class="header-brand">
    <div class="header-icon">📋</div>
    <div>
      <div>Aaradhya Recovery Dashboard</div>
      <div class="header-sub-row">
        <div class="header-sub">Collection & Route Planner</div>
        <span class="v-badge">v1.1</span>
      </div>
    </div>
  </div>
  <div class="live-chip">
    <div class="live-dot"></div>
    Live Recovery · Today Active
  </div>
</div>
<div id="routeBox" class="routeBox"></div>
<div class="s-lbl">👥 Customer Recovery List</div>
<div id="customerGrid" class="grid"></div>
</div>

<div id="profileScreen" style="display:none"></div>

<script>

const HQ_LAT=20.9964
const HQ_LNG=83.0526

const csvUrl="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ3bMMFf71-vdGNiWFnf7pD9XuAAUSA7J-g08ocyC2LNiVOTUHi56lB-7bKTKj0KK9nJGs9vU0THQ0E/pub?gid=1044390124&single=true&output=csv"

const tourPlan={
Monday:["Juria"],Tuesday:["Ghess"],Wednesday:["Gaisilate"],
Thursday:["Dava"],Friday:["Padampur"],Saturday:["Paikmal","Mandosil"]
}

let customers=[],todayRoute=[],selected={}
const today=new Date().toLocaleDateString('en-US',{weekday:'long'})
const todayAreas=tourPlan[today]||[]

function parseCSV(text){
const rows=[];let row=[],value="",insideQuotes=false
for(let char of text){
if(char=='"'){insideQuotes=!insideQuotes;continue}
if(char==","&&!insideQuotes){row.push(value);value="";continue}
if((char=="\n"||char=="\r")&&!insideQuotes){
if(value||row.length){row.push(value);rows.push(row)}
row=[];value="";continue}
value+=char}
return rows
}

fetch(csvUrl)
.then(res=>res.text())
.then(text=>{

let rows=parseCSV(text).slice(1).filter(r=>r[0])

customers=rows.map(r=>({
name:r[0],
area:r[1],
status:r[2],
reason:r[3],
reactivate:r[4],
business:r[5],
due:parseFloat(r[6])||0,
phone:r[13],
lat:parseFloat(r[14]),
lng:parseFloat(r[15]),
lastSale:r[17],
lastCollection:r[18],
route:r[19]
}))

todayRoute=customers.filter(c=>todayAreas.includes(c.area))

customers.sort((a,b)=>getRecoveryScore(b)-getRecoveryScore(a))

renderAll()

})

function getRecoveryScore(c){
const creditDays=Math.floor((new Date()-new Date(c.lastSale))/86400000)
let score=0
if(c.status.toLowerCase().includes("blocked")) score+=1000
if(creditDays>90) score+=500
else if(creditDays>60) score+=300
score+=c.due/1000
return score
}

function getDist(a,b,c,d){
const R=6371
const dLat=(c-a)*Math.PI/180
const dLng=(d-b)*Math.PI/180
const x=Math.sin(dLat/2)**2+
Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
Math.sin(dLng/2)**2
return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))
}

function calcRoute(){
let total=0,prevLat=HQ_LAT,prevLng=HQ_LNG
todayRoute.forEach(p=>{
if(p.lat){total+=getDist(prevLat,prevLng,p.lat,p.lng)
prevLat=p.lat;prevLng=p.lng}})
total+=getDist(prevLat,prevLng,HQ_LAT,HQ_LNG)
return total
}

function renderAll(){

let totalDist=calcRoute()
let time=(totalDist/25).toFixed(1)

routeBox.innerHTML=`
<div class="leftBox">
<b>🗓 Today’s Route – ${todayAreas.join(", ")}</b><br>
✔ Parties: ${todayRoute.length}<br>
✔ Round-trip: ${totalDist.toFixed(1)} km<br>
✔ Travel time: ${time} hrs<br>
<button class="tour" onclick="startTour()">🧭 Start Tour</button>
</div>

<div class="partyList">
${todayRoute.map((c,i)=>`
<div onclick="openProfileByName('${c.name}')">
${i+1}. ${c.name}<br>
📍 ${getDist(HQ_LAT,HQ_LNG,c.lat,c.lng).toFixed(1)} km
</div>`).join("")}
</div>
`

customerGrid.innerHTML=""

customers.forEach(c=>{
let creditDays=Math.floor((new Date()-new Date(c.lastSale))/86400000)

let tag=""
if(c.status.toLowerCase().includes("blocked")) tag="🔴 BLOCKED"
else if(c.due>0 && creditDays>60) tag="💰 COLLECT NOW"
else if(creditDays>60) tag="🟡 FOLLOW UP"

customerGrid.innerHTML+=`
<div class="customer" onclick="openProfileByName('${c.name}')">
<b>${c.name}</b><br>
${c.area} | ₹${c.due} | 📍 ${
(c.lat && c.lng)
? getDist(HQ_LAT,HQ_LNG,c.lat,c.lng).toFixed(1)+" km":"—"}
<br>${tag}
</div>`
})

}

function startTour(){
let route=todayRoute.map(c=>`${c.lat},${c.lng}`).join("/")
window.open(`https://www.google.com/maps/dir/${HQ_LAT},${HQ_LNG}/${route}/${HQ_LAT},${HQ_LNG}`)
}

function openProfileByName(name){

selected=customers.find(c=>c.name===name)

mainScreen.style.display="none"
profileScreen.style.display="block"

profileScreen.innerHTML=`
<div class="profileWrapper">

<div class="profileHeader">
<button class="backBtn" onclick="goBack()">⬅ Back</button>
Customer Profile
</div>

<div class="profileCard">

<h2>${selected.name}</h2>

<div class="info"><b>Phone:</b> <a href="tel:${selected.phone}">${selected.phone}</a></div>
<div class="info"><b>Area:</b> ${selected.area}</div>

<div class="info"><b>Total Business:</b> ₹${selected.business}</div>
<div class="info"><b>Total Due:</b> ₹${selected.due}</div>

<div class="info">📅 <b>Last Sale Date:</b> ${selected.lastSale}</div>
<div class="info">💰 <b>Last Payment:</b> ${selected.lastCollection}</div>
<div class="info">🗺 <b>Route:</b> ${selected.route}</div>

<div class="info"><b>Status:</b> ${selected.status}</div>
<div class="info"><b>Reason:</b> ${selected.reason}</div>
<div class="info"><b>Reactivate by paying:</b> ₹${selected.reactivate}</div>

<div class="actionRow">
<button class="call" onclick="call()">📞 Call</button>
<button class="wa" onclick="whatsapp()">🟢 WhatsApp</button>
<button class="nav" onclick="navigate()">📍 Navigate</button>
</div>

</div>
</div>
`
}

function goBack(){
profileScreen.style.display="none"
mainScreen.style.display="block"
}

function call(){window.location.href="tel:"+selected.phone}
function whatsapp(){window.open(`https://wa.me/91${selected.phone}`)}
function navigate(){window.open(`https://www.google.com/maps?q=${selected.lat},${selected.lng}`)}

</script>
</body>
</html>
